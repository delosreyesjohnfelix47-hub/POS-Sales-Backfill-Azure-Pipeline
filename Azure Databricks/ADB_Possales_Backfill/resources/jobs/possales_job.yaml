resources:
  jobs:
    Possales_Backfill_JOB:
      name: Possales_Backfill_JOB
      run_as: 
        user_name: ${var.email}

      permissions:
        - level: CAN_MANAGE
          user_name: ${var.email}
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.adf_managed_identity_app_id}

      tasks:
        - task_key: Create_Unity_Catalog
          notebook_task:
            notebook_path: ${var.repo_path}/Create Unity Catalog
            source: WORKSPACE
            base_parameters:
              NB_Storage_Account: ${var.storage_account}
              NB_Arm_Client_Id: ${var.arm_client_id}
              NB_Access_Connector: ${var.access_connector}
        - task_key: Raw_To_Bronze
          depends_on:
            - task_key: Create_Unity_Catalog
          notebook_task:
            notebook_path: ${var.repo_path}/POSSales Backfill Raw To Bronze
            source: WORKSPACE
            base_parameters:
              NB_Storage_Account: ${var.storage_account}
          environment_key: Default
        - task_key: Bronze_To_Silver
          depends_on:
            - task_key: Raw_To_Bronze
          notebook_task:
            notebook_path: ${var.repo_path}/POSSales Backfill Bronze To Silver
            source: WORKSPACE
            base_parameters:
              NB_Storage_Account: ${var.storage_account}
          environment_key: Default
        - task_key: Silver_To_Gold
          depends_on:
            - task_key: Bronze_To_Silver
          notebook_task:
            notebook_path: ${var.repo_path}/POSSales Backfill Silver to Gold
            source: WORKSPACE
            base_parameters:
              NB_Storage_Account: ${var.storage_account}
          environment_key: Default
      queue:
        enabled: true
      parameters:
        - name: NB_Month
          default: ""
        - name: NB_Year
          default: ""
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: STANDARD
