trigger:
  - main
#testt
pool:
  vmImage: "ubuntu-24.04"

stages:

# ─── DEV STAGE ───────────────────────────────────────────
- stage: DeployToDEV
  displayName: "Deploy To DEV"

  variables:
  - group: DEV-ADBVariables

  jobs:
  - job: DeployToDEV
    displayName: "Deploy To DEV"
    steps:
    - checkout: self

    - script: |
        curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
      displayName: "Install Databricks CLI"

    - script: |
        databricks bundle validate --target dev
        databricks bundle deploy --target dev \
          --var="storage_account=$(storage_account)" \
          --var="repo_path=$(repo_path)" \
          --var="access_connector=$(access_connector)" \
          --var="arm_client_id=$(arm_client_id)" \
          --var="adf_managed_identity_app_id=$(adf_managed_identity_app_id)" \
          --var="email=$(email)"  
      displayName: "Validate and Deploy Bundle To DEV"
      env:
        DATABRICKS_HOST: $(databricks_host)
        ARM_CLIENT_ID: $(arm_client_id)
        ARM_CLIENT_SECRET: $(arm_client_secret)
        ARM_TENANT_ID: $(arm_tenant_id)

# ─── QA STAGE ────────────────────────────────────────────
- stage: DeployToQA
  dependsOn: DeployToDEV
  condition: succeeded()
  displayName: "Deploy To QA"

  variables:
  - group: QA-ADBVariables

  jobs:
  - deployment: DeployToQA
    displayName: "Deploy To QA"
    environment: qa_approval
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: "Install Databricks CLI"

          - script: |
              databricks bundle validate --target qa
              databricks bundle deploy --target qa \
                --var="storage_account=$(storage_account)" \
                --var="repo_path=$(repo_path)" \
                --var="access_connector=$(access_connector)" \
                --var="arm_client_id=$(arm_client_id)" \
                --var="adf_managed_identity_app_id=$(adf_managed_identity_app_id)" \
                --var="email=$(email)"  
            displayName: "Validate and Deploy Bundle To QA"
            env:
              DATABRICKS_HOST: $(databricks_host)
              ARM_CLIENT_ID: $(arm_client_id)
              ARM_CLIENT_SECRET: $(arm_client_secret)
              ARM_TENANT_ID: $(arm_tenant_id)