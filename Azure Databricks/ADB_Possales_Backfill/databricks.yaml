bundle:
  name: Possales_Backfill_JOB

include: 
  - resources/jobs/possales_job.yaml 

variables:
  storage_account:
    description: ADLS storage account name
    default: ""
  repo_path:
    description: "Path to the Databricks Git folder"
    default: ""
  access_connector:
    description: "Access Connector For Unity Catalog"
    default: ""
  arm_client_id:
    description: "Service Principal For Unity Catalog"
    default: ""
  adf_managed_identity_app_id:
    description: "Managed Identity Application ID Of ADF"
    default: ""
  email:
    description: "Email to allow run of jobs in QA"
    default: ""
targets:
  dev:
    mode: development

  qa:
    mode: production